<svg width="1400" height="950" viewBox="0 0 1400 950" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<rect x="0" y="0" width="1400" height="950" fill="#ffffff"/>

<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
  <path d="M2 1L8 5L2 9" fill="none" stroke="#73726c" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<text x="700" y="35" text-anchor="middle" font-size="22" font-weight="700" fill="#3d3d3a">E-commerce Raw Schema (Bronze/Silver layer)</text>

<!-- ============ Relationship lines (drawn first, under boxes) ============ -->
<line x1="330" y1="180" x2="480" y2="180" stroke="#9c9a92" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="405" y="170" text-anchor="middle" font-size="12" fill="#73726c">customer_id</text>

<line x1="700" y1="180" x2="850" y2="180" stroke="#9c9a92" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="775" y="170" text-anchor="middle" font-size="12" fill="#73726c">order_id</text>

<line x1="700" y1="220" x2="850" y2="450" stroke="#9c9a92" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="720" y="330" text-anchor="middle" font-size="12" fill="#73726c">order_id</text>

<line x1="590" y1="270" x2="590" y2="450" stroke="#9c9a92" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="600" y="360" text-anchor="start" font-size="12" fill="#73726c">order_id</text>

<line x1="1020" y1="500" x2="1120" y2="500" stroke="#9c9a92" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="1070" y="490" text-anchor="middle" font-size="12" fill="#73726c">product_id</text>

<line x1="1020" y1="600" x2="1120" y2="700" stroke="#9c9a92" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="1090" y="650" text-anchor="middle" font-size="12" fill="#73726c">seller_id</text>

<!-- ============ CUSTOMERS ============ -->
<g>
<rect x="60" y="120" width="270" height="220" rx="10" fill="#f4f1ff" stroke="#8c7ae6" stroke-width="1.5"/>
<rect x="60" y="120" width="270" height="36" rx="10" fill="#8c7ae6"/>
<rect x="60" y="140" width="270" height="16" fill="#8c7ae6"/>
<text x="195" y="144" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">customers</text>
<text x="75" y="178" font-size="13" fill="#3d3d3a">🔑 customer_id (PK)</text>
<text x="75" y="200" font-size="13" fill="#3d3d3a">customer_unique_id</text>
<text x="75" y="222" font-size="13" fill="#3d3d3a">customer_name</text>
<text x="75" y="244" font-size="13" fill="#3d3d3a">customer_city</text>
<text x="75" y="266" font-size="13" fill="#3d3d3a">customer_state</text>
<text x="75" y="288" font-size="13" fill="#3d3d3a">customer_zip</text>
<text x="75" y="310" font-size="13" fill="#3d3d3a">signup_date</text>
</g>

<!-- ============ ORDERS ============ -->
<g>
<rect x="480" y="120" width="270" height="220" rx="10" fill="#e6faf7" stroke="#1abc9c" stroke-width="1.5"/>
<rect x="480" y="120" width="270" height="36" rx="10" fill="#1abc9c"/>
<rect x="480" y="140" width="270" height="16" fill="#1abc9c"/>
<text x="615" y="144" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">orders</text>
<text x="495" y="178" font-size="13" fill="#3d3d3a">🔑 order_id (PK)</text>
<text x="495" y="200" font-size="13" fill="#3d3d3a">🔗 customer_id (FK)</text>
<text x="495" y="222" font-size="13" fill="#3d3d3a">order_status</text>
<text x="495" y="244" font-size="13" fill="#3d3d3a">order_purchase_timestamp</text>
<text x="495" y="266" font-size="13" fill="#3d3d3a">order_approved_at</text>
<text x="495" y="288" font-size="13" fill="#3d3d3a">order_delivered_timestamp</text>
</g>

<!-- ============ PAYMENTS ============ -->
<g>
<rect x="850" y="120" width="270" height="160" rx="10" fill="#f4f1ff" stroke="#8c7ae6" stroke-width="1.5"/>
<rect x="850" y="120" width="270" height="36" rx="10" fill="#8c7ae6"/>
<rect x="850" y="140" width="270" height="16" fill="#8c7ae6"/>
<text x="985" y="144" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">payments</text>
<text x="865" y="178" font-size="13" fill="#3d3d3a">🔗 order_id (FK)</text>
<text x="865" y="200" font-size="13" fill="#3d3d3a">payment_type</text>
<text x="865" y="222" font-size="13" fill="#3d3d3a">payment_installments</text>
<text x="865" y="244" font-size="13" fill="#3d3d3a">payment_value</text>
</g>

<!-- ============ REVIEWS ============ -->
<g>
<rect x="850" y="360" width="270" height="180" rx="10" fill="#f4f1ff" stroke="#8c7ae6" stroke-width="1.5"/>
<rect x="850" y="360" width="270" height="36" rx="10" fill="#8c7ae6"/>
<rect x="850" y="380" width="270" height="16" fill="#8c7ae6"/>
<text x="985" y="384" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">reviews</text>
<text x="865" y="418" font-size="13" fill="#3d3d3a">🔑 review_id (PK)</text>
<text x="865" y="440" font-size="13" fill="#3d3d3a">🔗 order_id (FK)</text>
<text x="865" y="462" font-size="13" fill="#3d3d3a">review_score</text>
<text x="865" y="484" font-size="13" fill="#3d3d3a">review_comment_title</text>
<text x="865" y="506" font-size="13" fill="#3d3d3a">review_creation_date</text>
</g>

<!-- ============ ORDER_ITEMS (hub) ============ -->
<g>
<rect x="480" y="450" width="270" height="200" rx="10" fill="#e6faf7" stroke="#1abc9c" stroke-width="2"/>
<rect x="480" y="450" width="270" height="36" rx="10" fill="#1abc9c"/>
<rect x="480" y="470" width="270" height="16" fill="#1abc9c"/>
<text x="615" y="474" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">order_items (join hub)</text>
<text x="495" y="508" font-size="13" fill="#3d3d3a">🔗 order_id (FK)</text>
<text x="495" y="530" font-size="13" fill="#3d3d3a">order_item_id</text>
<text x="495" y="552" font-size="13" fill="#3d3d3a">🔗 product_id (FK)</text>
<text x="495" y="574" font-size="13" fill="#3d3d3a">🔗 seller_id (FK)</text>
<text x="495" y="596" font-size="13" fill="#3d3d3a">price</text>
<text x="495" y="618" font-size="13" fill="#3d3d3a">freight_value</text>
</g>

<!-- ============ PRODUCTS ============ -->
<g>
<rect x="1120" y="430" width="240" height="180" rx="10" fill="#f4f1ff" stroke="#8c7ae6" stroke-width="1.5"/>
<rect x="1120" y="430" width="240" height="36" rx="10" fill="#8c7ae6"/>
<rect x="1120" y="450" width="240" height="16" fill="#8c7ae6"/>
<text x="1240" y="454" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">products</text>
<text x="1135" y="488" font-size="13" fill="#3d3d3a">🔑 product_id (PK)</text>
<text x="1135" y="510" font-size="13" fill="#3d3d3a">product_category</text>
<text x="1135" y="532" font-size="13" fill="#3d3d3a">weight_g</text>
<text x="1135" y="554" font-size="13" fill="#3d3d3a">length_cm / height_cm / width_cm</text>
</g>

<!-- ============ SELLERS ============ -->
<g>
<rect x="1120" y="650" width="240" height="140" rx="10" fill="#f4f1ff" stroke="#8c7ae6" stroke-width="1.5"/>
<rect x="1120" y="650" width="240" height="36" rx="10" fill="#8c7ae6"/>
<rect x="1120" y="670" width="240" height="16" fill="#8c7ae6"/>
<text x="1240" y="674" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">sellers</text>
<text x="1135" y="708" font-size="13" fill="#3d3d3a">🔑 seller_id (PK)</text>
<text x="1135" y="730" font-size="13" fill="#3d3d3a">seller_city</text>
<text x="1135" y="752" font-size="13" fill="#3d3d3a">seller_state</text>
</g>

<!-- Legend -->
<rect x="60" y="850" width="18" height="18" fill="#1abc9c"/>
<text x="85" y="864" font-size="13" fill="#3d3d3a">Core transaction tables</text>
<rect x="280" y="850" width="18" height="18" fill="#8c7ae6"/>
<text x="305" y="864" font-size="13" fill="#3d3d3a">Supporting entity tables</text>
</svg>
