<svg width="1000" height="750" viewBox="0 0 1000 750" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<rect x="0" y="0" width="1000" height="750" fill="#ffffff"/>

<defs>
<marker id="arrow2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
  <path d="M2 1L8 5L2 9" fill="none" stroke="#73726c" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<text x="500" y="40" text-anchor="middle" font-size="24" font-weight="700" fill="#3d3d3a">Gold Layer — Star Schema</text>
<text x="500" y="66" text-anchor="middle" font-size="14" fill="#73726c">fact_order_items at the center, surrounded by four shared dimensions</text>

<!-- dim_customer (top) -->
<rect x="370" y="120" width="260" height="65" rx="10" fill="#f4f1ff" stroke="#8c7ae6" stroke-width="1.5"/>
<text x="500" y="158" text-anchor="middle" font-size="17" font-weight="700" fill="#3d3d3a">dim_customer</text>

<!-- dim_product (left) -->
<rect x="30" y="342" width="240" height="65" rx="10" fill="#f4f1ff" stroke="#8c7ae6" stroke-width="1.5"/>
<text x="150" y="380" text-anchor="middle" font-size="17" font-weight="700" fill="#3d3d3a">dim_product</text>

<!-- dim_seller (right) -->
<rect x="730" y="342" width="240" height="65" rx="10" fill="#f4f1ff" stroke="#8c7ae6" stroke-width="1.5"/>
<text x="850" y="380" text-anchor="middle" font-size="17" font-weight="700" fill="#3d3d3a">dim_seller</text>

<!-- dim_date (bottom) -->
<rect x="370" y="565" width="260" height="65" rx="10" fill="#f4f1ff" stroke="#8c7ae6" stroke-width="1.5"/>
<text x="500" y="603" text-anchor="middle" font-size="17" font-weight="700" fill="#3d3d3a">dim_date</text>

<!-- fact_order_items (center) -->
<rect x="345" y="322" width="310" height="98" rx="10" fill="#e6faf7" stroke="#1abc9c" stroke-width="2"/>
<text x="500" y="360" text-anchor="middle" font-size="19" font-weight="700" fill="#3d3d3a">fact_order_items</text>
<text x="500" y="385" text-anchor="middle" font-size="13" fill="#73726c">grain: 1 row per order line item</text>

<!-- connectors (drawn on top of boxes so labels stay visible) -->
<line x1="500" y1="315" x2="500" y2="192" stroke="#9c9a92" stroke-width="1.5" marker-end="url(#arrow2)"/>
<rect x="512" y="248" width="98" height="20" fill="#ffffff"/>
<text x="515" y="263" font-size="13" fill="#73726c">customer_key</text>

<line x1="500" y1="427" x2="500" y2="558" stroke="#9c9a92" stroke-width="1.5" marker-end="url(#arrow2)"/>
<rect x="512" y="488" width="68" height="20" fill="#ffffff"/>
<text x="515" y="503" font-size="13" fill="#73726c">date_key</text>

<line x1="338" y1="375" x2="223" y2="375" stroke="#9c9a92" stroke-width="1.5" marker-end="url(#arrow2)"/>
<rect x="235" y="345" width="88" height="20" fill="#ffffff"/>
<text x="240" y="360" font-size="13" fill="#73726c">product_key</text>

<line x1="662" y1="375" x2="777" y2="375" stroke="#9c9a92" stroke-width="1.5" marker-end="url(#arrow2)"/>
<rect x="672" y="345" width="78" height="20" fill="#ffffff"/>
<text x="677" y="360" font-size="13" fill="#73726c">seller_key</text>

<!-- legend -->
<rect x="380" y="690" width="18" height="18" fill="#1abc9c"/>
<text x="405" y="704" font-size="13" fill="#3d3d3a">Fact table</text>
<rect x="530" y="690" width="18" height="18" fill="#8c7ae6"/>
<text x="555" y="704" font-size="13" fill="#3d3d3a">Dimension tables</text>
</svg>
